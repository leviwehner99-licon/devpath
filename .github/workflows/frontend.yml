name: Frontend build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_DEVPATH_API_URL: ${{ vars.VITE_DEVPATH_API_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate EdgeOne API handlers and configuration
        run: |
          node --check 'website/cloud-functions/api/[[default]].js'
          node --check website/cloud-functions/lib/auth.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('website/edgeone.json', 'utf8'))"
