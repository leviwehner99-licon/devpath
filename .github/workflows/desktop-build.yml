name: Desktop build matrix

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          - os: macos-latest
            bundle: dmg
          - os: ubuntu-24.04
            bundle: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix website
      - name: Validate EdgeOne API handlers and configuration
        run: |
          node --check 'website/cloud-functions/api/[[default]].js'
          node --check website/cloud-functions/lib/auth.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('website/edgeone.json', 'utf8'))"
      - run: npm run tauri -- build --bundles ${{ matrix.bundle }}
      - name: Store unsigned CI package for review
        uses: actions/upload-artifact@v4
        with:
          name: DevPath-unsigned-${{ matrix.os }}-${{ github.sha }}
          path: src-tauri/target/release/bundle/${{ matrix.bundle }}/*
          if-no-files-found: error
          retention-days: 14
