name: Desktop build matrix

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            platform: windows-x64
          - os: macos-latest
            bundle: dmg
            platform: macos-arm64
          - os: ubuntu-24.04
            bundle: deb
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm ci --prefix website
      - name: Validate EdgeOne API handlers and configuration
        run: |
          node --check 'website/cloud-functions/api/[[default]].js'
          node --check website/cloud-functions/lib/auth.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('website/edgeone.json', 'utf8'))"
      - run: npm run tauri -- build --bundles ${{ matrix.bundle }}
      - name: Store unsigned CI package for review
        uses: actions/upload-artifact@v4
        with:
          name: DevPath-${{ matrix.platform }}-${{ github.sha }}
          path: src-tauri/target/release/bundle/${{ matrix.bundle }}/*
          if-no-files-found: error
          retention-days: 14

  build-macos-intel:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run tauri -- build --bundles dmg
      - name: Store unsigned Intel Mac package for review
        uses: actions/upload-artifact@v4
        with:
          name: DevPath-macos-x64-${{ github.sha }}
          path: src-tauri/target/release/bundle/dmg/*
          if-no-files-found: error
          retention-days: 14

  publish-installers:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [build, build-macos-intel]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: DevPath-windows-x64-${{ github.sha }}
          path: installers/windows
      - uses: actions/download-artifact@v5
        with:
          name: DevPath-macos-arm64-${{ github.sha }}
          path: installers/macos-arm64
      - uses: actions/download-artifact@v5
        with:
          name: DevPath-macos-x64-${{ github.sha }}
          path: installers/macos-x64
      - uses: actions/download-artifact@v5
        with:
          name: DevPath-linux-x64-${{ github.sha }}
          path: installers/linux
      - name: Upload public installers and checksums to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY as repository Actions secrets before publishing."
            exit 1
          fi

          upload_asset() {
            local file="$1" name="$2" content_type="$3"
            local digest
            digest="$(sha256sum "$file" | cut -d ' ' -f1)"
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              -X POST "$SUPABASE_URL/storage/v1/object/devpath-downloads/$name" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: $content_type" \
              -H "x-upsert: true" \
              --data-binary "@$file"
            printf '%s  %s\n' "$digest" "$name" > "$RUNNER_TEMP/$name.sha256"
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              -X POST "$SUPABASE_URL/storage/v1/object/devpath-downloads/$name.sha256" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H 'Content-Type: text/plain' \
              -H "x-upsert: true" \
              --data-binary "@$RUNNER_TEMP/$name.sha256"
            curl --fail --silent --show-error --output /dev/null \
              "$SUPABASE_URL/storage/v1/object/public/devpath-downloads/$name"
            echo "Published $name (SHA-256: $digest)"
          }

          windows_installer="$(find installers/windows -type f -iname '*.exe' -print -quit)"
          mac_arm_installer="$(find installers/macos-arm64 -type f -iname '*.dmg' -print -quit)"
          mac_intel_installer="$(find installers/macos-x64 -type f -iname '*.dmg' -print -quit)"
          linux_installer="$(find installers/linux -type f -iname '*.deb' -print -quit)"
          for file in "$windows_installer" "$mac_arm_installer" "$mac_intel_installer" "$linux_installer"; do
            [[ -n "$file" && -f "$file" ]] || { echo "Missing installer: $file"; exit 1; }
            size_bytes="$(stat -c '%s' "$file")"
            printf 'Installer size: %s (%s bytes)\n' "$file" "$size_bytes"
            if (( size_bytes > 48 * 1024 * 1024 )); then
              echo "Installer exceeds the safe 48 MiB upload limit for the current Supabase Storage plan: $file"
              exit 1
            fi
          done

          upload_asset "$windows_installer" 'DevPath-Windows-x64.exe' 'application/vnd.microsoft.portable-executable'
          upload_asset "$mac_arm_installer" 'DevPath-macOS-arm64.dmg' 'application/x-apple-diskimage'
          upload_asset "$mac_intel_installer" 'DevPath-macOS-x64.dmg' 'application/x-apple-diskimage'
          upload_asset "$linux_installer" 'DevPath-Linux-x64.deb' 'application/vnd.debian.binary-package'
      - name: Enable verified download links in the website
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          node scripts/enable-platform-downloads.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/download/index.html
          if git diff --cached --quiet; then
            echo 'Public download links already point to the current storage location.'
          else
            git commit -m 'Enable published cross-platform DevPath downloads'
            git push origin HEAD:main
          fi
