name: Dependency security audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [., server, website]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Audit locked npm dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=high --package-lock-only

  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust lockfile
        # rsa is only a transitive dependency of sqlx-mysql, an optional SQLx driver
        # not enabled by CodeZone (the app uses SQLite). RustSec has no patched rsa
        # release for RUSTSEC-2023-0071; remove this exception if MySQL/RSA is enabled.
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2023-0071
